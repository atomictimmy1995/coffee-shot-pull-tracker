<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espresso Shot Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>☕ Espresso Shot Tracker</h1>
    <p>Dial in your shots, one pull at a time</p>
  </header>

  <section class="card">
    <h2>Shot Timer</h2>
    <div class="timer-display" id="timerDisplay">0.0<small>s</small></div>
    <div class="timer-controls">
      <button class="btn-primary" id="timerBtn">Start</button>
      <button class="btn-ghost" id="timerReset">Reset</button>
    </div>
  </section>

  <section class="card">
    <h2>Shot Details</h2>
    <form id="shotForm" novalidate>
      <div class="grid">
        <div class="field">
          <label for="company">Coffee Company</label>
          <input type="text" id="company" placeholder="e.g. Counter Culture" autocomplete="off">
        </div>
        <div class="field">
          <label for="beans">Beans</label>
          <input type="text" id="beans" placeholder="e.g. Hologram" autocomplete="off">
        </div>
        <div class="field">
          <label for="grind">Grind Size</label>
          <input type="text" id="grind" placeholder="e.g. 2.5" autocomplete="off">
        </div>
        <div class="field">
          <label for="doseIn">Coffee In (g)</label>
          <input type="number" id="doseIn" placeholder="18" min="0" step="0.1" inputmode="decimal">
        </div>
        <div class="field">
          <label for="doseOut">Coffee Out (g)</label>
          <input type="number" id="doseOut" placeholder="36" min="0" step="0.1" inputmode="decimal">
        </div>
        <div class="field">
          <label for="shotTime">Shot Time (s)</label>
          <input type="number" id="shotTime" placeholder="Use timer or type" min="0" step="0.1" inputmode="decimal">
        </div>
        <div class="field full">
          <label for="comments">Comments</label>
          <textarea id="comments" rows="3" placeholder="Tasting notes, adjustments to try next time…"></textarea>
        </div>
        <div class="ratio-note" id="ratioNote"></div>
      </div>
      <div class="save-row">
        <button type="submit" class="btn-primary">Save Shot</button>
      </div>
      <div class="form-error" id="formError"></div>
    </form>
  </section>

  <section class="card">
    <div class="history-header">
      <h2>Shot History</h2>
      <button class="clear-all" id="clearAll" hidden>Clear all</button>
    </div>
    <div id="historyList"></div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
